[project]
name = "photopass-organizer"
version = "1.0.0"
description = "Your Disney PhotoPass photos sorted by day and park, shared with friends and family, with repeats and stock art cleared away"
requires-python = ">=3.12"
authors = [{ name = "SnoElement", email = "snoelement@icloud.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["disney", "photopass", "photos", "organizer"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]
dependencies = ["pillow>=10", "tomli-w>=1.0"]

[project.urls]
Homepage = "https://github.com/SnoElement/photopass-organizer"
Issues = "https://github.com/SnoElement/photopass-organizer/issues"
Changelog = "https://github.com/SnoElement/photopass-organizer/blob/main/CHANGELOG.md"

[project.scripts]
photopass-organizer = "photopass_organizer.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photopass_organizer"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "pyproject.toml"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["docs/superpowers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
